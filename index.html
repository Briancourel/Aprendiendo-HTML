<body>

    <table>

        </thead>
        <tbody>
           
        </tbody>
        <tfoot>

                <td><input></td>

                <td><input></td>
                <td><button onclick="add()">ADD</button></td>
            </tr>
        </tfoot>
    </table>

    <script>
        
        window.onload = () => {
        clear()
        }

        function add() {
          
            var tbody = document.getElementsByTagName("tbody")[0]
            var row = tbody.insertRow()
            var cell = row.insertCell()

            
            cell.innerHTML =  document.getElementsByTagName("input")[0].value
            cell = row.insertCell()
            cell.innerHTML =  document.getElementsByTagName("input")[1].value
            cell = row.insertCell()
            cell.innerHTML = document.getElementsByTagName("input")[2].value


            clear()



        }

        function clear() {

            document.getElementsByTagName("input")[0].value = ""
            document.getElementsByTagName("input")[1].value = ""
            document.getElementsByTagName("input")[2].value = ""
            document.getElementsByTagName("input")[0].focus()


        }
    </script>
